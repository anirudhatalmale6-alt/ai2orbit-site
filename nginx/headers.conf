# headers.conf - the headers every response carries
# Copyright (c) AI2ORBIT Co. 2026
#
# THIS FILE EXISTS BECAUSE OF AN NGINX RULE THAT COSTS PEOPLE THEIR SECURITY HEADERS.
#
# add_header is inherited from the enclosing block ONLY IF the current block defines no
# add_header of its own. The moment a location adds one header - a Cache-Control, say -
# it discards every add_header from the server block above it. Nothing warns about it.
# The config reads as though the policy applies everywhere, the front page carries it,
# and the locations that set their own caching quietly serve with no policy at all.
#
# That is not a hypothesis. The first run of check-container.sh had the three headers in
# the server block and a Cache-Control in "location = /", and the checks reported the
# content security policy missing from the front page while the cache header was present.
#
# So they live in one file which is included by the server AND by every location that
# sets a header of its own, and check-container.sh asserts the policy on a page response
# and on an image response - the two levels - so the trap cannot come back unnoticed.

# The page's own claim, written where a browser enforces it: index.html loads nothing from
# another host and runs no script. The day somebody pastes in an analytics tag, a web font
# or a CDN framework, the page breaks here rather than quietly starting to phone somewhere.
#
#   default-src 'none'          nothing is allowed unless named below
#   img-src 'self'              the three screenshots, from this host only
#   style-src 'unsafe-inline'   the stylesheet is inside <style> in the page
#   script-src is not named, so 'none' applies - there is no script on the page
#
# frame-ancestors is the deliberate exception. It is NOT 'none', because one of the ways
# this page is meant to be used is embedded in a Google Sites page, and Sites serves the
# embedding frame from googleusercontent. 'none' would show an empty box, with the reason
# visible only in a browser console.
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://sites.google.com https://*.googleusercontent.com" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
